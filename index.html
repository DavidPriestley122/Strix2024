<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Babylon.js Game</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/main.css" />
    <link rel="stylesheet" href="src/css/header.css" />
    <link rel="stylesheet" href="src/css/sidebar.css" />
    <link rel="stylesheet" href="src/css/game.css" />
    <link rel="stylesheet" href="src/css/footer.css" />
    <link rel="stylesheet" href="src/css/ai-sidebar.css" />

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #1a3a1a; /* Dark green background */
        color: white;
        font-family: "Libre Baskerville", serif;
      }

      #loadingScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1a3a1a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      #loadingBar {
        width: 300px;
        height: 30px;
        background-color: #3c280d;
        border-radius: 15px;
        overflow: hidden;
      }

      #loadingProgress {
        width: 0%;
        height: 100%;
        background-color: #7e0b28;
        transition: width 0.3s ease;
      }

      #loadingText {
        margin-top: 10px;
        font-size: 1.5em;
      }

      .game-title {
        text-align: center;
        font-size: 2.5em;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <div class="owl-logo">
          <div class="owl-diamond dark top-left"></div>
          <div class="owl-diamond dark top-center-left"></div>
          <div class="owl-diamond dark top-center-right"></div>
          <div class="owl-diamond light middle-left"></div>
          <div class="owl-diamond light middle-center-left">
            <div class="owl-eye"><div class="owl-pupil"></div></div>
          </div>
          <div class="owl-diamond light middle-center-right">
            <div class="owl-eye"><div class="owl-pupil"></div></div>
          </div>
          <div class="owl-diamond light middle-right"></div>
          <div class="owl-diamond dark bottom">
            <div class="owl-beak"></div>
          </div>
          <div class="owl-half-diamond left-wing"></div>
          <div class="owl-half-diamond right-wing"></div>
        </div>
      </div>
      <div class="title-container">
        <div class="title-background">
          <h1 class="game-title">STRIX<br />The Owls' Game</h1>
        </div>
      </div>
    </header>

    <main style="position: relative">
      <aside id="game-sidebar" class="sidebar">
        <button class="sidebar-toggle-tab" id="left-sidebar-toggle" title="Hide/show left sidebar">‹</button>
        <div class="main-categories">
          <button class="category-button" data-category="about-strix">
            About Strix
          </button>
          <button class="category-button" data-category="gameplay">
            How to Play
          </button>
          <button class="category-button" data-category="gallery">
            Gallery
          </button>
          <button class="category-button" data-category="your-turn">
            Your Turn
          </button>
          <button class="category-button" data-category="shop">Shop</button>
        </div>
        <div class="sub-categories"></div>
        <div class="content-area"></div>
      </aside>
      <div id="game-wrapper">
        <div id="game-container">
          <div id="loadingScreen">
            <div id="loadingBar">
              <div id="loadingProgress"></div>
            </div>
            <div id="loadingText">Loading... 0%</div>
          </div>
          <canvas id="renderCanvas"></canvas>
          <div id="button-container">
            <button id="restartButton">Restart Game</button>
            <button id="glassToggleButton" class="glass-toggle" title="Toggle Glass Mode">
              <span class="mode-label">Glass Mode:</span>
              <span class="mode-status">OFF</span>
            </button>
            <button id="maximizeButton" class="glass-toggle" title="Hide/show both sidebars">
              <span class="mode-label">Maximize:</span>
              <span class="mode-status">OFF</span>
            </button>
          </div>
        </div>
      </div>
      <div id="main-content-area" class="main-content"></div>
    </main>

    <aside id="ai-sidebar">
      <button class="sidebar-toggle-tab" id="right-sidebar-toggle" title="Hide/show right sidebar">›</button>
      <h2>AI Players</h2>
      <div class="ai-controls">
        <div class="player-config">
          <h3>Brown Team</h3>
          <label>
            <input type="radio" name="brown-player" value="human" checked />
            Human
          </label>
          <label>
            <input type="radio" name="brown-player" value="computer" />
            Computer
          </label>
        </div>

        <div class="player-config">
          <h3>Yellow Team</h3>
          <label>
            <input type="radio" name="yellow-player" value="human" checked />
            Human
          </label>
          <label>
            <input type="radio" name="yellow-player" value="computer" />
            Computer
          </label>
        </div>

        <div class="player-config">
          <h3>Green Team</h3>
          <label>
            <input type="radio" name="green-player" value="human" checked />
            Human
          </label>
          <label>
            <input type="radio" name="green-player" value="computer" />
            Computer
          </label>
        </div>

        <div class="game-controls">
          <h3>Game Control</h3>
          <button id="start-ai-game" class="control-button">
            Start AI Game
          </button>
          <button id="pause-game" class="control-button" disabled>Pause</button>
          <button id="resume-game" class="control-button" disabled>
            Resume
          </button>
        </div>

        <div class="move-panel">
          <h3>Move History & Game Manager</h3>

          <!-- Current Game - Always Visible -->
          <div class="current-game-section">
            <div class="section-label">Current Game</div>
            <div id="move-history-display" class="move-history-list">
              <!-- Moves added dynamically -->
            </div>
          </div>

          <!-- Enter Move - Always Visible -->
          <div class="enter-move-section">
            <div class="input-row-compact">
              <input
                type="text"
                id="move-input"
                class="move-input-compact"
                placeholder="Enter move (SGN): e.g. bO-b72"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="execute-move-btn" class="btn-execute">Execute</button>
            </div>
            <a href="#" class="sgn-help-link" title="Learn SGN notation">What is SGN?</a>
          </div>

          <!-- Load & Replay - Collapsible -->
          <div class="collapsible-section">
            <button class="section-header collapsed" data-section="load-replay">
              <span class="section-title">Load & Replay</span>
              <span class="section-arrow">▼</span>
            </button>
            <div class="section-content collapsed" id="load-replay-content">
              <div class="load-actions">
                <input type="file" id="import-file-input" accept=".sgn,.txt,.json" style="display: none;">
                <button id="import-file-btn" class="btn-secondary">📁 Load File</button>
                <button id="import-clipboard-btn" class="btn-secondary">📋 Paste SGN</button>
                <button id="analysis-library-btn" class="btn-secondary">📚 Browse Library</button>
              </div>

              <div id="replay-controls" class="replay-controls" style="display: none;">
                <div class="replay-transport">
                  <button id="replay-start-btn" class="btn-transport" title="Start">⏮</button>
                  <button id="replay-prev-btn" class="btn-transport" title="Previous">◀</button>
                  <button id="replay-next-btn" class="btn-transport" title="Next">▶</button>
                  <button id="replay-end-btn" class="btn-transport" title="End">⏭</button>
                  <button id="replay-stop-btn" class="btn-transport-stop" title="Stop & Reset">⏹</button>
                </div>
                <div class="replay-info">
                  <span id="replay-position">Position: 0/0</span>
                  <select id="replay-speed" class="replay-speed-select">
                    <option value="0">Step-by-step</option>
                    <option value="500">Fast (0.5s)</option>
                    <option value="1000" selected>Normal (1s)</option>
                    <option value="3000">Slow (3s)</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- Save & Export - Collapsible, Collapsed -->
          <div class="collapsible-section">
            <button class="section-header collapsed" data-section="save-export">
              <span class="section-title">Save & Export</span>
              <span class="section-arrow">▼</span>
            </button>
            <div class="section-content collapsed" id="save-export-content">
              <button id="save-to-analysis-btn" class="btn-primary-full">💾 Save to Library</button>
              <div class="export-row">
                <button id="copy-game-btn" class="btn-secondary">📋 Copy SGN</button>
                <button id="save-game-btn" class="btn-secondary">🔗 Download</button>
              </div>
            </div>
          </div>

          <!-- Game Analysis - Collapsible, Collapsed -->
          <div class="collapsible-section">
            <button class="section-header collapsed" data-section="analysis">
              <span class="section-title">Game Analysis</span>
              <span class="section-arrow">▼</span>
            </button>
            <div class="section-content collapsed" id="analysis-content">
              <div class="analysis-note">Research tool for pattern analysis</div>
              <button id="save-analysis-full-btn" class="btn-primary-full">💾 Save with Analysis Data</button>
              <button id="export-analysis-btn" class="btn-secondary-full">📥 Export Library</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Analysis Dialog Modal -->
    <div id="analysis-dialog" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--dark-chocolate); border: 2px solid var(--owl-beak); border-radius: 10px; padding: 20px; z-index: 2000; width: 500px; max-height: 80vh; overflow-y: auto;">
      <h3 style="color: var(--owl-beak); margin-top: 0;">Save Game to Analysis</h3>

      <label style="display: block; margin-top: 15px; color: var(--owl-light);">
        Pattern Name:
        <input type="text" id="analysis-pattern-name" placeholder="e.g., kingmaking-via-ghosting" style="width: 100%; margin-top: 5px; padding: 8px; background: rgba(0,0,0,0.6); border: 1px solid var(--owl-light); border-radius: 4px; color: white;">
      </label>

      <label style="display: block; margin-top: 15px; color: var(--owl-light);">
        Tags (comma-separated):
        <input type="text" id="analysis-tags" placeholder="e.g., kingmaking, ghosting, third-bird-violation" style="width: 100%; margin-top: 5px; padding: 8px; background: rgba(0,0,0,0.6); border: 1px solid var(--owl-light); border-radius: 4px; color: white;">
      </label>

      <label style="display: block; margin-top: 15px; color: var(--owl-light);">
        Critical Move Number:
        <input type="number" id="analysis-critical-move" min="1" placeholder="Move number" style="width: 100%; margin-top: 5px; padding: 8px; background: rgba(0,0,0,0.6); border: 1px solid var(--owl-light); border-radius: 4px; color: white;">
      </label>

      <label style="display: block; margin-top: 15px; color: var(--owl-light);">
        Thicket Level (0-3):
        <input type="number" id="analysis-thicket" min="0" max="3" value="1" style="width: 100%; margin-top: 5px; padding: 8px; background: rgba(0,0,0,0.6); border: 1px solid var(--owl-light); border-radius: 4px; color: white;">
      </label>

      <label style="display: block; margin-top: 15px; color: var(--owl-light);">
        Notes:
        <textarea id="analysis-notes" rows="4" placeholder="Describe what makes this game interesting..." style="width: 100%; margin-top: 5px; padding: 8px; background: rgba(0,0,0,0.6); border: 1px solid var(--owl-light); border-radius: 4px; color: white; font-family: inherit;"></textarea>
      </label>

      <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
        <button id="analysis-cancel-btn" class="control-button secondary">Cancel</button>
        <button id="analysis-save-btn" class="control-button primary">Save</button>
      </div>
    </div>

    <!-- Overlay for modal -->
    <div id="analysis-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1999;"></div>

    <footer>
      <p>&copy; 2024 David Priestley. All rights reserved.</p>
    </footer>

    <!-- Backend API Configuration -->
    <script>
      window.STRIX_API_URL = 'https://web-production-7af99.up.railway.app';
    </script>

    <script src="dist/bundle.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const container = document.getElementById("game-container");
        const canvas = document.getElementById("renderCanvas");
        const restartButton = document.getElementById("restartButton");
        const loadingScreen = document.getElementById("loadingScreen");
        const loadingProgress = document.getElementById("loadingProgress");
        const loadingText = document.getElementById("loadingText");

        let currentProgress = 0;

        function updateLoadingBar(progress) {
          currentProgress = Math.min(100, Math.max(currentProgress, progress));
          loadingProgress.style.width = `${currentProgress}%`;
          loadingText.textContent = `Loading... ${Math.round(
            currentProgress
          )}%`;

          if (currentProgress >= 100) {
            setTimeout(hideLoadingScreen, 500);
          }
        }

        function hideLoadingScreen() {
          loadingScreen.style.opacity = "0";
          loadingScreen.style.transition = "opacity 0.5s ease";
          setTimeout(() => {
            loadingScreen.style.display = "none";
          }, 500);
        }

        let initialLoadingInterval = setInterval(() => {
          if (currentProgress < 90) {
            updateLoadingBar(currentProgress + 1);
          } else {
            clearInterval(initialLoadingInterval);
          }
        }, 50);

        window.finalizeLoading = function () {
          clearInterval(initialLoadingInterval);
          updateLoadingBar(100);
        };

        function restartGame() {
          console.log("Game restarting...");

          // Check if there are moves in the history
          const moveHistory = document.getElementById('move-history-display');
          const hasMoves = moveHistory && moveHistory.children.length > 0;

          // Confirm before restarting if game is in progress
          if (hasMoves) {
            if (!confirm('Restart game and lose all current moves?')) {
              console.log("Restart cancelled by user");
              return;
            }
          }

          location.reload();
        }

        restartButton.addEventListener("click", restartGame);

        // Glass Mode Toggle
        const glassToggleButton = document.getElementById("glassToggleButton");
        const modeStatus = glassToggleButton.querySelector(".mode-status");

        glassToggleButton.addEventListener("click", function () {
          if (window.toggleGlassMode) {
            const isGlass = window.toggleGlassMode();
            modeStatus.textContent = isGlass ? "ON" : "OFF";
            glassToggleButton.classList.toggle("active", isGlass);
          }
        });

        document.addEventListener("keydown", function (event) {
          // Don't trigger shortcuts when typing in input fields
          const activeElement = document.activeElement;
          const isTyping = activeElement && (
            activeElement.tagName === "INPUT" ||
            activeElement.tagName === "TEXTAREA" ||
            activeElement.isContentEditable
          );

          if (!isTyping && (event.key === "r" || event.key === "R")) {
            restartGame();
          }
        });
      });
    </script>
  </body>
</html>
