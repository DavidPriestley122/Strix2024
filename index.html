<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Babylon.js Game</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/main.css" />
    <link rel="stylesheet" href="src/css/header.css" />
    <link rel="stylesheet" href="src/css/sidebar.css" />
    <link rel="stylesheet" href="src/css/game.css" />
    <link rel="stylesheet" href="src/css/footer.css" />
    <link rel="stylesheet" href="src/css/ai-sidebar.css" />

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #1a3a1a; /* Dark green background */
        color: white;
        font-family: "Libre Baskerville", serif;
      }

      #loadingScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1a3a1a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      #loadingBar {
        width: 300px;
        height: 30px;
        background-color: #3c280d;
        border-radius: 15px;
        overflow: hidden;
      }

      #loadingProgress {
        width: 0%;
        height: 100%;
        background-color: #7e0b28;
        transition: width 0.3s ease;
      }

      #loadingText {
        margin-top: 10px;
        font-size: 1.5em;
      }

      .game-title {
        text-align: center;
        font-size: 2.5em;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <div class="owl-logo">
          <div class="owl-diamond dark top-left"></div>
          <div class="owl-diamond dark top-center-left"></div>
          <div class="owl-diamond dark top-center-right"></div>
          <div class="owl-diamond light middle-left"></div>
          <div class="owl-diamond light middle-center-left">
            <div class="owl-eye"><div class="owl-pupil"></div></div>
          </div>
          <div class="owl-diamond light middle-center-right">
            <div class="owl-eye"><div class="owl-pupil"></div></div>
          </div>
          <div class="owl-diamond light middle-right"></div>
          <div class="owl-diamond dark bottom">
            <div class="owl-beak"></div>
          </div>
          <div class="owl-half-diamond left-wing"></div>
          <div class="owl-half-diamond right-wing"></div>
        </div>
      </div>
      <div class="title-container">
        <div class="title-background">
          <h1 class="game-title">STRIX<br />The Owls' Game</h1>
        </div>
      </div>
    </header>

    <main style="position: relative">
      <!-- Mobile menu buttons -->
      <button class="mobile-menu-btn left" id="left-menu-btn" aria-label="Toggle left menu">☰</button>
      <button class="mobile-menu-btn right" id="right-menu-btn" aria-label="Toggle right menu">☰</button>

      <!-- Mobile backdrop -->
      <div class="mobile-backdrop" id="mobile-backdrop"></div>

      <aside id="game-sidebar" class="sidebar">
        <div class="main-categories">
          <button class="category-button" data-category="about-strix">
            About Strix
          </button>
          <button class="category-button" data-category="gameplay">
            How to Play
          </button>
          <button class="category-button" data-category="gallery">
            Gallery
          </button>
          <button class="category-button" data-category="your-turn">
            Your Turn
          </button>
          <button class="category-button" data-category="shop">Shop</button>
        </div>
        <div class="sub-categories"></div>
        <div class="content-area"></div>
      </aside>
      <div id="game-wrapper">
        <div id="game-container">
          <div id="loadingScreen">
            <div id="loadingBar">
              <div id="loadingProgress"></div>
            </div>
            <div id="loadingText">Loading... 0%</div>
          </div>
          <canvas id="renderCanvas"></canvas>
          <div id="button-container">
            <button id="restartButton">Restart Game</button>
            <button id="glassToggleButton" class="glass-toggle" title="Toggle Glass Mode">
              <span class="mode-label">Glass Mode:</span>
              <span class="mode-status">OFF</span>
            </button>
          </div>
        </div>
      </div>
      <div id="main-content-area" class="main-content"></div>
    </main>

    <aside id="ai-sidebar">
      <h2>AI Players</h2>
      <div class="ai-controls">
        <div class="player-config">
          <h3>Brown Team</h3>
          <label>
            <input type="radio" name="brown-player" value="human" checked />
            Human
          </label>
          <label>
            <input type="radio" name="brown-player" value="computer" />
            Computer
          </label>
        </div>

        <div class="player-config">
          <h3>Yellow Team</h3>
          <label>
            <input type="radio" name="yellow-player" value="human" checked />
            Human
          </label>
          <label>
            <input type="radio" name="yellow-player" value="computer" />
            Computer
          </label>
        </div>

        <div class="player-config">
          <h3>Green Team</h3>
          <label>
            <input type="radio" name="green-player" value="human" checked />
            Human
          </label>
          <label>
            <input type="radio" name="green-player" value="computer" />
            Computer
          </label>
        </div>

        <div class="game-controls">
          <h3>Game Control</h3>
          <button id="start-ai-game" class="control-button">
            Start AI Game
          </button>
          <button id="pause-game" class="control-button" disabled>Pause</button>
          <button id="resume-game" class="control-button" disabled>
            Resume
          </button>
        </div>

        <div class="move-panel">
          <h3>Move History & Input</h3>
          
          <div class="move-history-section">
            <div class="move-history-header">
              <span class="history-title">Game Moves</span>
              <button id="clear-history-btn" class="small-button" title="Clear History">⊗</button>
            </div>
            <div id="move-history-display" class="move-history-list">
              <!-- Moves will be added dynamically -->
            </div>
          </div>

          <div class="move-input-section">
            <label for="move-input" class="input-label">Enter Move:</label>
            <div class="input-row">
              <input 
                type="text" 
                id="move-input" 
                class="move-input" 
                placeholder="e.g., bO-b72"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="validate-move-btn" class="small-button" title="Validate move">✓</button>
            </div>
            <div class="button-row">
              <button id="execute-move-btn" class="control-button primary">Execute</button>
              <button id="clear-input-btn" class="control-button secondary">Clear</button>
            </div>
          </div>



          <div class="collapsible-section">
            <button class="section-header" data-section="export">
              <span class="section-title">Export Game</span>
              <span class="section-arrow">▼</span>
            </button>
            <div class="section-content" id="export-content">
              <div class="export-controls">
                <div class="export-buttons">
                  <button id="export-sgn-btn" class="small-button" title="Export as SGN format">SGN</button>
                  <button id="export-txt-btn" class="small-button" title="Export as text">TXT</button>
                  <button id="export-json-btn" class="small-button" title="Export as JSON">JSON</button>
                </div>
                <div class="export-actions">
                  <button id="copy-game-btn" class="control-button secondary" title="Copy game to clipboard">📋 Copy</button>
                  <button id="save-game-btn" class="control-button secondary" title="Save game to file">💾 Save</button>
                </div>
              </div>
            </div>
          </div>

          <div class="collapsible-section">
            <button class="section-header" data-section="import">
              <span class="section-title">Import & Replay</span>
              <span class="section-arrow">▼</span>
            </button>
            <div class="section-content" id="import-content">
              <div class="import-controls">
                <div class="import-actions">
                  <input type="file" id="import-file-input" accept=".sgn,.txt,.json" style="display: none;">
                  <button id="import-file-btn" class="control-button secondary" title="Load game from file">📁 Load File</button>
                  <button id="import-clipboard-btn" class="control-button secondary" title="Load game from clipboard">📋 From Clipboard</button>
                </div>
                <div class="replay-options">
                  <label for="replay-speed" class="speed-label">Speed:</label>
                  <select id="replay-speed" class="speed-select">
                    <option value="500">Fast (0.5s)</option>
                    <option value="1000" selected>Normal (1s)</option>
                    <option value="2000">Slow (2s)</option>
                    <option value="3000">Very Slow (3s)</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <footer>
      <p>&copy; 2024 David Priestley. All rights reserved.</p>
    </footer>

    <script src="dist/bundle.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const container = document.getElementById("game-container");
        const canvas = document.getElementById("renderCanvas");
        const restartButton = document.getElementById("restartButton");
        const loadingScreen = document.getElementById("loadingScreen");
        const loadingProgress = document.getElementById("loadingProgress");
        const loadingText = document.getElementById("loadingText");

        let currentProgress = 0;

        function updateLoadingBar(progress) {
          currentProgress = Math.min(100, Math.max(currentProgress, progress));
          loadingProgress.style.width = `${currentProgress}%`;
          loadingText.textContent = `Loading... ${Math.round(
            currentProgress
          )}%`;

          if (currentProgress >= 100) {
            setTimeout(hideLoadingScreen, 500);
          }
        }

        function hideLoadingScreen() {
          loadingScreen.style.opacity = "0";
          loadingScreen.style.transition = "opacity 0.5s ease";
          setTimeout(() => {
            loadingScreen.style.display = "none";
          }, 500);
        }

        let initialLoadingInterval = setInterval(() => {
          if (currentProgress < 90) {
            updateLoadingBar(currentProgress + 1);
          } else {
            clearInterval(initialLoadingInterval);
          }
        }, 50);

        window.finalizeLoading = function () {
          clearInterval(initialLoadingInterval);
          updateLoadingBar(100);
        };

        function restartGame() {
          console.log("Game restarting...");
          // Add your game restart logic here
          // For now, let's just reload the page
          location.reload();
        }

        restartButton.addEventListener("click", restartGame);

        // Glass Mode Toggle
        const glassToggleButton = document.getElementById("glassToggleButton");
        const modeStatus = glassToggleButton.querySelector(".mode-status");

        glassToggleButton.addEventListener("click", function () {
          if (window.toggleGlassMode) {
            const isGlass = window.toggleGlassMode();
            modeStatus.textContent = isGlass ? "ON" : "OFF";
            glassToggleButton.classList.toggle("active", isGlass);
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "r" || event.key === "R") {
            restartGame();
          }
        });

        // Mobile sidebar toggle functionality
        const leftMenuBtn = document.getElementById("left-menu-btn");
        const rightMenuBtn = document.getElementById("right-menu-btn");
        const leftSidebar = document.getElementById("game-sidebar");
        const rightSidebar = document.getElementById("ai-sidebar");
        const backdrop = document.getElementById("mobile-backdrop");

        function toggleLeftSidebar() {
          leftSidebar.classList.toggle("mobile-open");
          backdrop.classList.toggle("active");
          // Close right sidebar if open
          rightSidebar.classList.remove("mobile-open");
        }

        function toggleRightSidebar() {
          rightSidebar.classList.toggle("mobile-open");
          backdrop.classList.toggle("active");
          // Close left sidebar if open
          leftSidebar.classList.remove("mobile-open");
        }

        function closeAllSidebars() {
          leftSidebar.classList.remove("mobile-open");
          rightSidebar.classList.remove("mobile-open");
          backdrop.classList.remove("active");
        }

        leftMenuBtn.addEventListener("click", toggleLeftSidebar);
        rightMenuBtn.addEventListener("click", toggleRightSidebar);
        backdrop.addEventListener("click", closeAllSidebars);
      });
    </script>
  </body>
</html>
